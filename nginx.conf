server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Set per-location: a bare types{} block here would replace the whole
    # inherited mime.types map and strip the types off js/css/png.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # The worker must be revalidated or the installed app can never update.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Hashed asset filenames are safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so a new build is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Single-page app: unknown paths fall back to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
