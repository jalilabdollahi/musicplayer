# HighFi Player — music.mydailyreport.xyz
# Static PWA (Docker, 127.0.0.1:3012) behind Cloudflare.
#
# Install:
#   ln -sf /etc/nginx/sites-available/highfi-player /etc/nginx/sites-enabled/highfi-player
#   nginx -t && systemctl reload nginx
#
# Cloudflare notes:
#   - The subdomain must be proxied (orange cloud); Cloudflare terminates public TLS.
#   - HTTPS matters here beyond privacy: the app is an installable PWA, and
#     service workers plus the File System Access API require a secure context.
#   - Origin TLS is added by certbot once the DNS record exists:
#       certbot --nginx -d music.mydailyreport.xyz
server {
    listen 80;
    listen [::]:80;
    server_name music.mydailyreport.xyz;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The service worker must never be cached, at the origin or at the edge, or
    # clients stay pinned to an old precache long after a deploy.
    location = /sw.js {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
